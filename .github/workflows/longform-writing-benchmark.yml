name: Long-form writing benchmark contracts

on:
  push:
    paths:
      - 'papa-kojo-writing-style/benchmarks/longform/**'
      - '.github/workflows/longform-writing-benchmark.yml'
  pull_request:
    paths:
      - 'papa-kojo-writing-style/benchmarks/longform/**'
      - '.github/workflows/longform-writing-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-longform-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
      - name: Run 6 local, offline benchmark contract tests
        run: python3 -m unittest discover -s papa-kojo-writing-style/benchmarks/longform -p 'tests_longform.py' -v
