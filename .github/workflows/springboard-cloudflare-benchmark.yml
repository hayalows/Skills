name: Springboard Cloudflare benchmark integrity

on:
  push:
    branches:
      - benchmark/cloudflare-2026-11-19
    paths:
      - .github/workflows/springboard-cloudflare-benchmark.yml
      - springboard-mentor/benchmarks/cloudflare-20261119/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out archived benchmark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Recompute counts and conservative audit
        run: python3 springboard-mentor/benchmarks/cloudflare-20261119/score_cloudflare.py
