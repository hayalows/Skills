name: Verify Skills Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "*/SKILL.md"
      - "vercel-deployment-steward/**"
      - "master-craft/**"
      - "model-assurance/**"
      - "product-evidence/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/verify-site.yml"
  pull_request:
    paths:
      - "master-craft/**"
      - "model-assurance/**"
      - "product-evidence/**"
      - "site/**"
      - "*/SKILL.md"
      - "package.json"
      - "vercel.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public directory
        run: npm run build
      - name: Verify generated output
        run: |
          test -f dist/index.html
          test -f dist/skill-index.json
          test -f dist/skills/product-design-os.json
          test -f dist/skills/papa-kojo-writing-style.json
          test -f dist/skills/vercel-deployment-steward.json
          test -f dist/skills/master-craft.json
          test -f dist/skills/product-evidence.json
          test -f dist/skills/model-assurance.json
          node -e "const s=require('./dist/skill-index.json'); if(s.length !== 18) process.exit(1);"
      - name: Validate Master Craft files and skill routing index
        run: |
          node --check master-craft/scripts/inventory.mjs
          node --check master-craft/tests/router-smoke.mjs
          node master-craft/tests/router-smoke.mjs
          node master-craft/tests/freshness.e2e.mjs
          node master-craft/tests/plan.e2e.mjs
      - name: Check deployment audit CLI syntax
        run: node --check vercel-deployment-steward/scripts/audit-deployments.mjs
      - name: Run deployment audit CLI end-to-end checks
        run: node vercel-deployment-steward/tests/cli-smoke.mjs
